<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Survival WebGL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #hud { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 14px; pointer-events: none; }
        #stealth-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0055; font-size: 28px; display: none; }
        #satchel-ui { position: absolute; bottom: 10px; right: 10px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00ffcc; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <div>ROLE: <span id="role-display">ASSIGNING LOBBY ROLE...</span></div>
        <div>HP: <span id="hp">100</span> | AMMO: <span id="ammo">SATCHEL LOADED</span></div>
        <div>QUEST: Act 1 - Clear Forest & Test Grapple</div>
    </div>
    <div id="stealth-ui">ALERT: DETECTED! HIDE IN VASE / RAFTER (3s)</div>
    <div id="satchel-ui">
        <b>BACKPACK SATCHEL:</b><br>
        - Steel Longsword [EQUIPPED]<br>
        - Grappling Hook [READY]<br>
        - Ammo-Anything Gun [CONNECTED]
    </div>

    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.03);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // LIGHTS
        const ambientLight = new THREE.AmbientLight(0x223344);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 2. WORLD & OBJECTS
        // Forest Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x0a150f, side: THREE.DoubleSide });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = Math.PI / 2;
        scene.add(ground);

        // Giant Stealth Vase
        const vaseGeo = new THREE.CylinderGeometry(1.5, 1, 4, 16);
        const vaseMat = new THREE.MeshPhongMaterial({ color: 0x885533 });
        const vase = new THREE.Mesh(vaseGeo, vaseMat);
        vase.position.set(5, 2, -5);
        scene.add(vase);

        // Rafter Structure
        const rafterGeo = new THREE.BoxGeometry(20, 0.5, 0.5);
        const rafterMat = new THREE.MeshPhongMaterial({ color: 0x555566 });
        const rafter = new THREE.Mesh(rafterGeo, rafterMat);
        rafter.position.set(0, 8, -10);
        scene.add(rafter);

        // Alien Sentries
        const alienGeo = new THREE.SphereGeometry(1, 16, 16);
        const alienMat = new THREE.MeshPhongMaterial({ color: 0xff0033 });
        const alien = new THREE.Mesh(alienGeo, alienMat);
        alien.position.set(-5, 1, -12);
        scene.add(alien);

        // 3. PLAYER SETUP
        camera.position.set(0, 1.7, 5);
        let velocityY = 0;
        let isGrappling = false;

        // MULTIPLAYER AUTOMATIC ROLE ASSIGNMENT (Lobby Join Order)
        const roles = ["Field Commander", "Quartermaster", "Pathfinder", "Shadow Specialist"];
        const assignedRole = roles[Math.floor(Math.random() * roles.length)];
        document.getElementById("role-display").innerText = assignedRole + " (Assigned by Server)";

        // 4. CONTROLS & MECHANICS
        window.addEventListener('keydown', (e) => {
            // Movement
            if (e.key === 'w') camera.position.z -= 0.3;
            if (e.key === 's') camera.position.z += 0.3;
            if (e.key === 'a') camera.position.x -= 0.3;
            if (e.key === 'd') camera.position.x += 0.3;

            // Grappling Hook to Rafter (E)
            if (e.key === 'e' && !isGrappling) {
                isGrappling = true;
                const grappleInterval = setInterval(() => {
                    camera.position.x += (rafter.position.x - camera.position.x) * 0.1;
                    camera.position.y += (rafter.position.y - camera.position.y) * 0.1;
                    camera.position.z += (rafter.position.z - camera.position.z) * 0.1;

                    if (camera.position.distanceTo(rafter.position) < 1.5) {
                        clearInterval(grappleInterval);
                        isGrappling = false;
                    }
                }, 16);
            }
        });

        // 5. ENGINE LOOP
        function animate() {
            requestAnimationFrame(animate);

            // Alien Proximity & Stealth Check
            const distToAlien = camera.position.distanceTo(alien.position);
            const distToVase = camera.position.distanceTo(vase.position);
            const stealthUI = document.getElementById("stealth-ui");

            if (distToAlien < 8 && distToVase > 2 && camera.position.y < 6) {
                stealthUI.style.display = "block";
            } else {
                stealthUI.style.display = "none";
            }

            renderer.render(scene, camera);
        }
        animate();

        // Window Resize Fix
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
