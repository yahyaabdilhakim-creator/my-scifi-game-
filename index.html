<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS GAMING | Chrono Shift</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; overflow-x: hidden; min-height: 100vh; }
        
        /* Navigation Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background: rgba(13, 17, 23, 0.95);
            border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #00ffcc; text-transform: uppercase; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: #8b949e; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .nav-links a:hover { color: #00ffcc; }

        /* Main Container */
        .main-container { padding: 40px; max-width: 1400px; margin: 0 auto; }

        /* Game Section */
        .game-header { margin-bottom: 25px; }
        .game-header h1 { font-size: 36px; color: #ffffff; margin-bottom: 8px; }
        .game-header p { color: #8b949e; font-size: 16px; }

        /* WebGL / Canvas Container */
        .canvas-card {
            position: relative; width: 100%; height: 600px; background: #000;
            border-radius: 12px; border: 1px solid #30363d; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Story Overlay Modal inside Canvas */
        #story-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 12, 0.92); z-index: 10;
            display: flex; justify-content: center; align-items: center; text-align: center;
            transition: opacity 0.5s ease;
        }
        .story-content {
            max-width: 550px; padding: 30px; background: #161b22;
            border: 2px solid #00ffcc; border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }
        .story-content h2 { color: #00ffcc; margin-bottom: 15px; font-size: 26px; }
        .story-content p { color: #c9d1d9; line-height: 1.6; margin-bottom: 25px; font-size: 15px; }
        .btn-launch {
            background: #00ffcc; color: #0b0f19; border: none; padding: 12px 30px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .btn-launch:hover { background: #00cca3; transform: scale(1.05); }

        /* HUD Overlay */
        #hud-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .hud-badge {
            background: rgba(13, 17, 23, 0.85); border-left: 4px solid #00ffcc;
            padding: 10px 15px; border-radius: 4px; backdrop-filter: blur(5px);
        }
        .hud-badge label { font-size: 11px; color: #8b949e; text-transform: uppercase; display: block; }
        .hud-badge span { font-size: 16px; font-weight: bold; color: #00ffcc; }

        /* Transformation Wheel UI */
        #watch-wheel {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 5; display: flex; gap: 12px; background: rgba(13, 17, 23, 0.9);
            padding: 12px 20px; border-radius: 30px; border: 1px solid #30363d;
            backdrop-filter: blur(10px);
        }
        .form-btn {
            background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
            padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .form-btn:hover { background: #30363d; border-color: #00ffcc; }
